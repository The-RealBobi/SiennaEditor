name: Build Sienna Editor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Package ${{ matrix.runtime }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            runtime: win-x64
          - runner: macos-15
            runtime: osx-arm64

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Checkout CFGBINManager source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: The-RealBobi/CFGBINManager
          ref: a5af615b40dc9afcb3934d8e68f8dfb5adc31da9 # 1.0.2
          path: dependency/CFGBINManager
          persist-credentials: false

      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1 -Runtime '${{ matrix.runtime }}'

      - name: Package macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: bash ./build.sh '${{ matrix.runtime }}'

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SiennaEditor-${{ matrix.runtime }}
          path: dist/*.zip
          if-no-files-found: error
